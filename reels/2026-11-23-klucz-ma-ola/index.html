html, body { width: 1080px; height: 1920px; overflow: hidden; background: #05120D; }

.full { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
.kick { position: absolute; left: 90px; font-family: JB; font-size: 30px; letter-spacing: .16em; color: #96D6BC; }

.h { position: absolute; left: 90px; width: 760px; font-family: M8; letter-spacing: -0.01em; line-height: 1.12; }
.mint { color: #3CFFB0; }
.sage { color: #96D6BC; }
.bub { position: absolute; font-family: M6; font-size: 46px; line-height: 1.15; padding: 22px 34px; border-radius: 34px; }
.bub.ola { background: #0B241B; border: 3px solid #3CFFB0; color: #EAF7F1; }
.bub.me { background: #96D6BC; color: #05120D; }
.bub.ola::after { content: ""; position: absolute; right: 56px; bottom: -15px; width: 26px; height: 26px; background: #0B241B; border-right: 3px solid #3CFFB0; border-bottom: 3px solid #3CFFB0; transform: rotate(45deg); }
.bub.me::after { content: ""; position: absolute; right: 34px; bottom: -12px; width: 24px; height: 24px; background: #96D6BC; transform: rotate(45deg); }
.bub .who { display: block; font-family: JB; font-size: 22px; letter-spacing: .14em; color: #3CFFB0; margin-bottom: 6px; }
.end-t { position: absolute; left: 0; width: 940px; text-align: center; }
.cta { position: absolute; left: 300px; top: 1250px; width: 340px; height: 92px; border-radius: 46px; border: 3px solid #3CFFB0;
  background: rgba(60,255,176,.12); font-family: M6; font-size: 40px; display: flex; align-items: center; justify-content: center; }
</style>
</head>

<script>
window.__timelines = window.__timelines || {};

// --- drobiny światła w tle (deterministyczne) ---
(function () {
  let s = 7; const r = () => (s = (s * 16807) % 2147483647) / 2147483647;
  let h = '';
  for (let i = 0; i < 26; i++) h += `<circle cx="${(r() * 1080).toFixed(0)}" cy="${(r() * 1920).toFixed(0)}" r="${(1.5 + r() * 3).toFixed(1)}" opacity="${(0.04 + r() * 0.08).toFixed(2)}"/>`;
  document.getElementById('motes').innerHTML = h;
})();

// --- zbliżenie biurka z góry (dwa warianty) ---
function closeUp(id, written) {
  const lines = [];
  for (let i = 0; i < 11; i++) {
    const y = 770 + i * 40;
    lines.push(`<line x1="150" y1="${y}" x2="440" y2="${y}" stroke="rgba(150,214,188,.22)" stroke-width="2"/>`);
    if (i < written) {
      const w = 180 + ((i * 53) % 100);
      lines.push(`<path d="M160 ${y - 8} q 12 -14 24 0 t 24 0 t 24 0 t 24 0 t 24 0 t 24 0 t 24 0 t 24 0 t 24 0 t 24 0" fill="none" stroke="#3CFFB0" stroke-opacity=".5" stroke-width="3" stroke-dasharray="${w} 400"/>`);
    }
  }
  const holes = []; for (let i = 0; i < 12; i++) holes.push(`<circle cx="132" cy="${730 + i * 40}" r="7" fill="#0A1F18"/>`);
  return `
  <defs>
    <clipPath id="${id}clip"><rect x="70" y="640" width="940" height="800" rx="44"/></clipPath>
    <filter id="${id}blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>
  <g clip-path="url(#${id}clip)">
    <rect x="70" y="640" width="940" height="800" fill="#123A2D"/>
    <g fill="none" stroke="rgba(150,214,188,.06)" stroke-width="3">
      <path d="M70 700 C 300 690, 600 716, 1010 698"/><path d="M70 860 C 380 850, 700 874, 1010 856"/><path d="M70 1020 C 300 1032, 640 1006, 1010 1024"/><path d="M70 1210 C 360 1196, 680 1220, 1010 1204"/><path d="M70 1370 C 300 1380, 700 1356, 1010 1372"/>
    </g>
    <g transform="rotate(-7 290 960)">
      <rect x="110" y="700" width="360" height="520" rx="12" fill="#1F5743"/>
      ${lines.join('')}${holes.join('')}
