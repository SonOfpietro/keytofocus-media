<!doctype html>
<html lang="pl" data-resolution="portrait">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920">
<script src="assets/gsap.min.js"></script>
<style>
@font-face { font-family: M8; src: url(assets/Manrope-800.ttf); }
@font-face { font-family: M6; src: url(assets/Manrope-600.ttf); }
@font-face { font-family: M4; src: url(assets/Manrope-400.ttf); }
@font-face { font-family: JB; src: url(assets/JetBrainsMono-700.ttf); }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: #05120D; }
#root { position: relative; width: 1080px; height: 1920px; overflow: hidden;
  background: radial-gradient(circle at 44% 50%, #0B241B 0%, #05120D 62%); color: #EAF7F1; }
.clip { position: absolute; inset: 0; }
.h { position: absolute; left: 90px; width: 760px; font-family: M8; letter-spacing: -0.01em; line-height: 1.14; }
.mint { color: #3CFFB0; }
.sage { color: #96D6BC; }
.pill { position: absolute; left: 90px; top: 300px; font-family: JB; font-size: 30px; letter-spacing: .18em; color: #3CFFB0;
  border: 3px solid rgba(60,255,176,.7); border-radius: 40px; padding: 10px 26px 8px; }
.row { position: absolute; left: 90px; width: 760px; height: 132px; display: flex; align-items: center; gap: 30px;
  padding: 0 34px; border-radius: 30px; background: rgba(11,36,27,.92); border: 2px solid rgba(150,214,188,.22); }
.row .ico { width: 64px; height: 64px; flex: 0 0 64px; }
.row .txt { font-family: M6; font-size: 42px; color: #EAF7F1; }
.row .chk { margin-left: auto; width: 54px; height: 54px; flex: 0 0 54px; }
.ico path, .ico circle, .ico rect, .ico line { fill: none; stroke: #3CFFB0; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
.chk circle { fill: none; stroke: rgba(60,255,176,.55); stroke-width: 3; }
.chk path { fill: none; stroke: #3CFFB0; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
.dots { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
.end-t { position: absolute; left: 0; width: 940px; text-align: center; }
.cta { position: absolute; left: 300px; top: 1250px; width: 340px; height: 92px; border-radius: 46px; border: 3px solid #3CFFB0;
  background: rgba(60,255,176,.12); font-family: M6; font-size: 40px; display: flex; align-items: center; justify-content: center; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="15.5" data-width="1080" data-height="1920">

  <!-- tło: powoli dryfujące kropki -->
  <svg class="dots clip" id="bgdots" data-start="0" data-duration="15.5" data-track-index="0" viewBox="0 0 1080 1920">
    <g id="dotgrid" fill="rgba(150,214,188,.07)"></g>
  </svg>

  <!-- SCENA 1: POV (klatka 0 czytelna) -->
  <div class="clip" id="s1" data-start="0" data-duration="3.0" data-track-index="1">
    <div class="pill" id="pov">POV</div>
    <div class="h" id="s1t" style="top:400px; font-size:86px">Idziesz po klucz,<br><span class="mint">żeby odblokować Instagram.</span></div>
    <svg id="path1" style="position:absolute; left:0; top:0" width="1080" height="1920" viewBox="0 0 1080 1920">
      <path id="walk" d="M470 980 C 470 1120, 300 1160, 300 1300 S 470 1480, 470 1640" fill="none" stroke="rgba(60,255,176,.75)" stroke-width="6" stroke-linecap="round" stroke-dasharray="2 22"/>
      <g id="keyic" transform="translate(470 900)">
        <circle cx="0" cy="0" r="62" fill="#0B241B" stroke="#3CFFB0" stroke-width="3.5"/>
        <g transform="rotate(-45)" fill="none" stroke="#3CFFB0" stroke-width="7" stroke-linecap="round">
          <circle cx="-18" cy="0" r="12"/><path d="M-6 0 H 28 M18 0 V 10 M27 0 V 8"/>
        </g>
      </g>
    </svg>
  </div>

  <!-- SCENA 2: lista „po drodze” -->
  <div class="clip" id="s2" data-start="3.0" data-duration="6.3" data-track-index="1">
    <div class="h sage" id="s2h" style="top:420px; font-size:64px; font-family:M6">Po drodze:</div>
    <div class="row" id="r1" style="top:540px">
      <svg class="ico" viewBox="0 0 64 64"><path d="M16 26 h30 l-3 26 h-24 z"/><path d="M46 31 h5 a6 6 0 0 1 0 12 h-6"/><path d="M24 18 q3 -5 0 -10 M32 18 q3 -5 0 -10"/></svg>
      <div class="txt">nastawiasz czajnik</div>
      <svg class="chk" viewBox="0 0 54 54"><circle cx="27" cy="27" r="24"/><path class="tick" d="M16 28 l7 7 l15 -16"/></svg>
    </div>
    <div class="row" id="r2" style="top:696px">
      <svg class="ico" viewBox="0 0 64 64"><path d="M20 40 h24 l-3 16 h-18 z"/><path d="M32 40 V 22"/><path d="M32 30 q-12 -2 -14 -14 q12 2 14 14"/><path d="M32 26 q10 -2 12 -12 q-10 2 -12 12"/></svg>
      <div class="txt">podlewasz kwiatka</div>
      <svg class="chk" viewBox="0 0 54 54"><circle cx="27" cy="27" r="24"/><path class="tick" d="M16 28 l7 7 l15 -16"/></svg>
    </div>
    <div class="row" id="r3" style="top:852px">
      <svg class="ico" viewBox="0 0 64 64"><path d="M12 16 h40 v26 h-24 l-10 8 v-8 h-6 z"/><line x1="20" y1="26" x2="44" y2="26"/><line x1="20" y1="33" x2="36" y2="33"/></svg>
      <div class="txt">odpisujesz mamie</div>
      <svg class="chk" viewBox="0 0 54 54"><circle cx="27" cy="27" r="24"/><path class="tick" d="M16 28 l7 7 l15 -16"/></svg>
    </div>
    <div class="row" id="r4" style="top:1008px">
      <svg class="ico" viewBox="0 0 64 64"><rect x="12" y="10" width="40" height="44" rx="3"/><line x1="32" y1="10" x2="32" y2="54"/><line x1="12" y1="32" x2="52" y2="32"/></svg>
      <div class="txt">otwierasz okno</div>
      <svg class="chk" viewBox="0 0 54 54"><circle cx="27" cy="27" r="24"/><path class="tick" d="M16 28 l7 7 l15 -16"/></svg>
    </div>
  </div>

  <!-- SCENA 3: powrót z herbatą -->
  <div class="clip" id="s3" data-start="9.3" data-duration="4.2" data-track-index="1">
    <div class="h" id="s3a" style="top:400px; font-size:76px">Wracasz z herbatą.</div>
    <div class="h sage" id="s3b" style="top:510px; font-size:56px; font-family:M6">A Instagram? Zapomniałeś.</div>
    <svg id="cup" style="position:absolute; left:290px; top:800px" width="360" height="420" viewBox="0 0 360 420">
      <g fill="none" stroke="#3CFFB0" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
        <path id="st1" d="M130 150 q-20 -30 0 -60 q20 -30 0 -60"/>
        <path id="st2" d="M180 150 q-20 -30 0 -60 q20 -30 0 -60"/>
        <path id="st3" d="M230 150 q-20 -30 0 -60 q20 -30 0 -60"/>
        <path d="M80 190 h200 v90 a90 90 0 0 1 -90 90 h-20 a90 90 0 0 1 -90 -90 z" fill="rgba(60,255,176,.08)"/>
        <path d="M280 220 h22 a36 36 0 0 1 0 72 h-26"/>
        <path d="M60 400 h240"/>
      </g>
    </svg>
    <div class="h mint" id="s3c" style="top:1250px; font-size:60px">Chęć przeszła gdzieś przy czajniku.</div>
  </div>

  <!-- SCENA 4: plansza końcowa -->
  <div class="clip" id="s4" data-start="13.5" data-duration="2.0" data-track-index="1">
    <svg id="logo" style="position:absolute; left:370px; top:560px" width="200" height="200" viewBox="0 0 200 200">
      <g fill="none" stroke="#3CFFB0" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10 70 V 40 Q10 10 40 10 H 70"/><path d="M130 10 H 160 Q190 10 190 40 V 70"/>
        <path d="M190 130 V 160 Q190 190 160 190 H 130"/><path d="M70 190 H 40 Q10 190 10 160 V 130"/>
        <g transform="translate(104 104) rotate(-45)"><circle cx="-34" cy="0" r="22"/><path d="M-12 0 H 52 M34 0 V 18 M50 0 V 14"/></g>
      </g>
    </svg>
    <div class="end-t" style="top:840px; font-family:M8; font-size:84px">Key to Focus</div>
    <div class="end-t mint" id="e2" style="top:970px; font-family:M8; font-size:62px">Szukam testerów</div>
    <div class="end-t sage" id="e3" style="top:1060px; font-family:M4; font-size:40px">Android 8+ z NFC · bezpłatnie</div>
    <div class="cta" id="cta">link w bio</div>
  </div>
</div>

<script>
window.__timelines = window.__timelines || {};
// deterministyczna siatka kropek
(function () {
  const g = document.getElementById('dotgrid');
  let html = '';
  for (let y = -60; y < 1980; y += 60) for (let x = 30; x < 1080; x += 60) html += `<circle cx="${x}" cy="${y}" r="1.8"/>`;
  g.innerHTML = html;
})();
const tl = gsap.timeline({ paused: true, defaults: { ease: 'power2.out' } });
const ease = 'power2.inOut';
tl.to('#dotgrid', { y: 60, duration: 15.5, ease: 'none' }, 0);

// S1 – tekst widoczny od klatki 0; animuje się tylko droga do klucza
tl.fromTo('#walk', { strokeDashoffset: 0 }, { strokeDashoffset: 240, duration: 2.6, ease: 'none' }, 0);
tl.fromTo('#keyic', { scale: 1, transformOrigin: '50% 50%' }, { scale: 1.08, duration: .9, ease: 'sine.inOut', yoyo: true, repeat: 1 }, .6);
tl.to(['#s1t', '#pov', '#path1'], { opacity: 0, y: -20, duration: .4, ease }, 2.6);

// S2 – lista
tl.fromTo('#s2h', { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: .5 }, 3.05);
const items = ['#r1', '#r2', '#r3', '#r4'], T0 = 3.45, STEP = 1.25;
items.forEach((id, i) => {
  const at = T0 + i * STEP;
  tl.fromTo(id, { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: .55 }, at);
  tl.fromTo(`${id} .tick`, { strokeDasharray: 40, strokeDashoffset: 40 }, { strokeDashoffset: 0, duration: .4 }, at + .45);
});
tl.to(['#s2h', ...items], { opacity: 0, y: -24, duration: .45, ease, stagger: .04 }, 8.85);

// S3 – herbata
tl.fromTo('#s3a', { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: .6 }, 9.35);
tl.fromTo('#cup', { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: .8 }, 9.45);
['#st1', '#st2', '#st3'].forEach((s, i) => {
  tl.fromTo(s, { opacity: 0, y: 20 }, { opacity: .9, y: -10, duration: 1.1, ease: 'sine.inOut', repeat: 2, yoyo: true }, 9.7 + i * .25);
});
tl.fromTo('#s3b', { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: .6 }, 10.5);
tl.fromTo('#s3c', { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: .6 }, 11.7);
tl.to(['#s3a', '#s3b', '#cup', '#s3c'], { opacity: 0, duration: .4, ease }, 13.1);

// S4 – plansza końcowa
tl.fromTo('#logo', { opacity: 0, scale: .9, transformOrigin: '100px 100px' }, { opacity: 1, scale: 1, duration: .6 }, 13.55);
tl.fromTo('#s4 .end-t', { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: .5, stagger: .18 }, 13.7);
tl.fromTo('#cta', { opacity: 0, scale: .92 }, { opacity: 1, scale: 1, duration: .5 }, 14.3);
tl.to('#s4', { opacity: 0, duration: .4, ease: 'none' }, 15.1);

window.__timelines['main'] = tl;
tl.seek(0);
</script>
</body>
</html>
